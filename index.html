<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WebLLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>WebLLM Chat</h1>
    <p>
      Local model in the browser.
      <span class="hint">Memory is saved in cookies.</span>
      Web search runs on each question.
    </p>

    <p>
      Model
      <select id="model"></select>
      <span class="hint">loads when you pick it</span>
    </p>
    <p>
      Memory <span class="hint">(one fact per line)</span><br />
      <textarea id="memory" rows="3" placeholder="I live in …"></textarea>
    </p>
    <p id="status">Checking browser…</p>
    <progress id="progress" value="0" max="1"></progress>

    <div id="log"></div>

    <form id="form">
      <textarea id="prompt" rows="3" placeholder="Ask something…" required></textarea>
      <p><button type="submit" id="send">Send</button></p>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
