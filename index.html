<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WebLLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>WebLLM Chat</h1>
    <p>Local model in the browser. Chats and memory are saved in cookies. Web search runs on each question.</p>

    <p>
      Model
      <select id="model"></select>
    </p>
    <p>
      Chat
      <select id="chats"></select>
      <button type="button" id="new-chat">New chat</button>
      <button type="button" id="delete-chat">Delete</button>
    </p>
    <p>
      Memory (one fact per line)<br />
      <textarea id="memory" rows="3" placeholder="I live in …"></textarea>
    </p>
    <p id="status">Checking browser…</p>
    <progress id="progress" value="0" max="1"></progress>

    <hr />
    <div id="log"></div>

    <form id="form">
      <textarea id="prompt" rows="3" placeholder="Ask something…" required></textarea>
      <p><button type="submit" id="send">Send</button></p>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
