<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>WebLLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div id="sidebar-backdrop" class="backdrop" hidden></div>

      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <strong>WebLLM Chat</strong>
            <p>Runs on-device in your browser</p>
          </div>
        </div>

        <button id="new-chat" class="new-chat" type="button">New chat</button>
        <nav id="chat-list" class="chat-list" aria-label="Chats"></nav>

        <div class="sidebar-bottom">
          <label class="field">
            <span>Model</span>
            <select id="model-select"></select>
          </label>

          <div class="skills" role="group" aria-label="Skills">
            <button id="skill-memory" class="chip" type="button" aria-pressed="false">
              Memory
            </button>
            <button id="skill-search" class="chip" type="button" aria-pressed="false">
              Web search
            </button>
          </div>

          <div id="memory-panel" class="memory-panel" hidden>
            <div class="memory-head">
              <span>Saved memories</span>
              <button id="clear-memories" class="text-btn" type="button">Clear</button>
            </div>
            <ul id="memory-list"></ul>
            <p id="memory-empty" class="hint">Facts you ask it to remember stay on this device.</p>
          </div>

          <details class="settings">
            <summary>Generation</summary>
            <label class="field">
              <span>Temperature <strong id="temperature-value">0.7</strong></span>
              <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7" />
            </label>
            <label class="field">
              <span>Max new tokens</span>
              <input id="max-tokens" type="number" min="32" max="2048" step="32" value="512" />
            </label>
          </details>

          <div class="status-wrap">
            <p id="status-text">Checking browser capabilities…</p>
            <div class="progress" aria-hidden="true">
              <div id="progress-bar" class="progress-fill"></div>
            </div>
          </div>
        </div>
      </aside>

      <section class="stage">
        <header class="topbar">
          <button id="menu-btn" class="icon-btn" type="button" aria-label="Open chats">
            <span></span>
          </button>
          <div class="topbar-copy">
            <h1 id="chat-title">New chat</h1>
            <p id="chat-sub">Local models, cookies for chats and memory</p>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea
            id="prompt"
            rows="1"
            placeholder="Message the local model…"
            required
          ></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
